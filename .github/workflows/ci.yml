name: CI

# Only pull requests and manual dispatch start runs. No push trigger, so
# publishing a branch by itself cannot start a billable run.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml pins channel 1.99.1; cargo selects it in this repo.
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Record machine
        run: |
          uname -m
          uname -s
          rustc -Vv
          cargo -V

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (debug)
        run: cargo test --locked

      - name: Test (release)
        run: cargo test --release --locked
